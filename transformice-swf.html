<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformice - Ruffle</title>
    <style type="text/css">
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden;
            background-color: #6A7495;
        }
        #game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- 
        ВАЖНО: Игра не загрузится, если у вас нет файла "Transformice.swf".
        Оригинальный загрузчик (ChargeurTransformice.swf) пытается скачать игру с оф. сервера,
        но браузер блокирует это из-за CORS (политика безопасности).
        
        ИНСТРУКЦИЯ ПО ЗАПУСКУ:
        1. Найдите файл "Transformice.swf" (основной клиент игры).
        2. Положите его в эту же папку рядом с этим html файлом.
        3. Обновите страницу.
        
        Без локального файла Transformice.swf игра работать НЕ БУДЕТ из-за блокировки CORS.
    -->

    <!-- Подключаем Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        // Настраиваем Ruffle
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            allowScriptAccess: "always",
            autoplay: "on",
            backgroundColor: "#6A7495",
            unmuteOverlay: "hidden",
            contextMenu: true,
            logging: "warn"
        };

        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            const container = document.getElementById("game-container");
            container.appendChild(player);

            player.style.width = "100%";
            player.style.height = "100%";

            // Загружаем загрузчик. 
            // ОШИБКА CORS: Загрузчик попытается сделать запрос к https://www.transformice.com/Transformice.swf,
            // но браузер заблокирует его, так как сервер не отправляет заголовок Access-Control-Allow-Origin.
            player.load({
                url: "ChargeurTransformice.swf",
                allowScriptAccess: "always"
            }).catch(err => {
                console.error("Ruffle error:", err);
                alert("Ошибка CORS: Загрузчик не может скачать игру с официального сервера.\nПожалуйста, скачайте файл 'Transformice.swf' и положите его рядом с этим файлом.");
            });
        });
    </script>
</body>
</html>
